name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-balance-site-2z11la]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /minsu.kim_homepage
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Pages 배포는 기본 브랜치에서만 한다.
  # github-pages 환경은 기본/보호 브랜치만 허용하므로 기능 브랜치에서는
  # 잡이 시작도 못 하고 실패한다. 기능 브랜치에서는 build 잡이 검증만 담당.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
